<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arma Server</title>
  <link rel="stylesheet" href="dist/style.css" />
</head>
<body>
  <main>
    <h1>Arma 3 server</h1>

    <section>
      <h2>Server</h2>
      <div class="row">
        <span id="state" class="badge">…</span>
        <span id="detail" class="muted"></span>
      </div>
      <div class="row">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
      </div>
      <p id="server-error" class="error" hidden></p>
    </section>

    <section>
      <h2>Mods</h2>
      <p id="modset-summary" class="muted">…</p>
      <div id="preset-upload"></div>
      <p class="muted small">
        Arma 3 Launcher → Mods → Preset → Export to file. Changes apply at the next start.
      </p>
      <p id="modset-error" class="error" hidden></p>
      <ul id="warnings" class="warnings"></ul>
      <ol id="mods" class="mods"></ol>
    </section>

    <section>
      <h2>Config files</h2>
      <p class="muted small">Changes apply at the next start.</p>
      <p id="files-error" class="error" hidden></p>
      <table class="files">
        <tbody id="files"></tbody>
      </table>
    </section>

    <section>
      <h2>Log</h2>
      <div id="log" class="log"></div>
    </section>
  </main>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
